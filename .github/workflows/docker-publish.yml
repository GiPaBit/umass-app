name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Belt and braces. The Dockerfile pins its only RUN-bearing stage to the runner's
      # own architecture, so nothing should need emulating today — but a future RUN in
      # the runtime stage would break the arm64 leg without this.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases this for us. GHCR rejects the capitals in
          # "GiPaBit", so never hand-write this image name anywhere else.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # The default flavor only tags `latest` on semver tags, and
            # docker-compose.yml pins :latest — without this, pushes to main would
            # never reach a server running `docker compose pull`.
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Carries org.opencontainers.image.source, which is what links the package
          # to this repo in the GitHub Packages UI.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BASE=/
            VITE_API_BASE=
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
